server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Bắt buộc có 2 header này để ứng dụng chạy được SharedArrayBuffer & WebGPU/Workers
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Xử lý Single Page Application (SPA) - chuyển hướng mọi đường dẫn về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tối ưu cache cho các file asset, WASM và Worker
    location ~* \.(js|css|wasm|worker\.js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
